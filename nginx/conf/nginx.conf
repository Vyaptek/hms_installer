worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # No nginx version in the Server header or error pages (backend plan 24, I2).
    server_tokens off;

    # A request whose Host is not this box gets no answer (plan 24, L5), so a forged Host header cannot
    # reach the application.
    server {
        listen       80 default_server;
        server_name  _;
        return       444;
    }

    server {
        listen       80;
        # localhost, 127.0.0.1, any IPv4 address (a box's DHCP address may change) and this computer's
        # name, written by the installer. Add the hospital's own DNS names to server-names-extra.conf,
        # which upgrades keep.
        server_name  localhost 127.0.0.1 "~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$";
        include      server-names.conf;
        include      server-names-extra.conf;
        client_max_body_size 10m;

        include      security-headers.conf;

        location / {
            root   "../frontend";
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:8080/api/;
            proxy_set_header   Host $host;
            # The backend takes the client address from X-Real-IP, trusted from loopback only (C3).
            proxy_set_header   X-Real-IP $remote_addr;
            # Tomcat also trusts these from loopback (C3), so never pass the client's own.
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Port $server_port;
            # security-headers.conf sets these; drop Spring Security's copies so each is sent once.
            proxy_hide_header  X-Frame-Options;
            proxy_hide_header  X-Content-Type-Options;
            proxy_hide_header  Referrer-Policy;
            proxy_hide_header  X-XSS-Protection;
            proxy_read_timeout    120s;
            proxy_connect_timeout  10s;
        }
    }
}
