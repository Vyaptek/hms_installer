worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # No nginx version in the Server header or error pages (backend plan 24, I2).
    server_tokens off;

    # A request whose Host is not this box gets no answer (plan 24, L5), so a forged Host header cannot
    # reach the application.
    server {
        listen       80 default_server;
        server_name  _;
        return       444;
    }

    # The hospital's site: HTTPS (lan-site-https.conf) once this box has its certificate, plain HTTP
    # (lan-site-http.conf) until then or if it could not be made (backend plan 24 section 11, OP5).
    # lan-tls.ps1 writes the one line in lan-site.conf; the installer ships it as plain HTTP.
    include lan-site.conf;
}
