# HMS itself: the React frontend and the backend's API. Included by the site in lan-site-http.conf or
# lan-site-https.conf, whichever this box serves.
client_max_body_size 10m;

# Cache headers come from "expires", not add_header: an add_header here would stop these locations
# inheriting the server's security headers and HSTS.

# Built files carry a content hash in their names, so they never change. A missing one (an old page asking
# for a file the last upgrade removed) is a 404, never index.html served as JavaScript.
location /assets/ {
    root       "../frontend";
    expires    max;
    try_files  $uri =404;
}

location / {
    root   "../frontend";
    index  index.html index.htm;
    # index.html names the current build's files: the browser must check for a new one every time, or after
    # an upgrade it keeps asking for files that are gone ("Failed to fetch dynamically imported module").
    expires  -1;
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass         http://127.0.0.1:8080/api/;
    proxy_set_header   Host $host;
    # The backend takes the client address from X-Real-IP, trusted from loopback only (C3).
    proxy_set_header   X-Real-IP $remote_addr;
    # Tomcat also trusts these from loopback (C3), so never pass the client's own. X-Forwarded-Proto
    # https is what makes the backend mark its cookies Secure (SessionCookies, OP5).
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Port $server_port;
    # security-headers.conf sets these; drop Spring Security's copies so each is sent once.
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  X-Content-Type-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  X-XSS-Protection;
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
}
