# Plain HTTP on port 80: how every box served HMS before OP5 (backend plan 24 section 11). Used until this
# box has its HTTPS certificate, and again if lan-tls.ps1 could not make one, so HMS keeps working.
server {
    listen       80;
    include      hms-server-names.conf;
    include      security-headers.conf;
    include      hms-app.conf;
}
