# HTTPS on the hospital's network (backend plan 24 section 11, OP5). This box is its own certificate
# authority, limited to its own names and private addresses; lan-tls.ps1 (as SYSTEM, at every start, every
# hour and when the network changes) keeps tls\server.crt covering this computer's names and addresses and
# restarts nginx when it changes. Each PC trusts the authority once, from http://<this computer>/trust.

ssl_certificate      tls/server.crt;
ssl_certificate_key  tls/server.key;
ssl_protocols        TLSv1.2 TLSv1.3;
# The certificate is ECDSA (P-256): Mozilla's "intermediate" TLS 1.2 suites for it. TLS 1.3 suites are
# OpenSSL's defaults.
ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache    shared:HMS:2m;
ssl_session_timeout  1d;
ssl_session_tickets  off;

# As on port 80 (L5): a Host this box does not answer to gets no answer. It has to complete the TLS
# handshake first, with the same certificate: a client that typed an IP address sends no server name, so
# refusing the handshake here (ssl_reject_handshake) would refuse every PC that uses the address.
server {
    listen       443 ssl default_server;
    server_name  _;
    return       444;
}

server {
    listen       443 ssl;
    http2        on;
    include      hms-server-names.conf;
    include      security-headers.conf;
    # One year. No includeSubDomains: the box's names are its own. Browsers ignore HSTS for an IP address.
    add_header   Strict-Transport-Security "max-age=31536000" always;
    include      hms-trust.conf;
    include      hms-app.conf;
}

# Port 80 now only helps a browser get to HTTPS. check.html (for every page) asks for
# https://<same host>/trust/ok.txt: when this PC trusts the box it goes on to the same page over HTTPS,
# otherwise to the trust page. Nothing of HMS itself is served over plain HTTP any more.
server {
    listen       80;
    include      hms-server-names.conf;
    include      security-headers.conf;
    include      hms-trust.conf;

    # A program calling the API over HTTP: the same request over HTTPS (308 keeps the method and body).
    location /api/ {
        return 308 https://$host$request_uri;
    }

    location / {
        root       trust;
        try_files  /check.html =404;
        expires    -1;
    }
}
