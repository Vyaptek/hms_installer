# The trust page, http://<this computer>/trust/ (backend plan 24 section 11, OP5), on HTTP and HTTPS. Its
# own pages come with the installer (nginx\trust); the certificate files are this box's own, written by
# lan-tls.ps1: Trust-Vyaptek-HMS.bat (Windows), vyaptek-hms-ca.crt (Android and others) and
# vyaptek-hms-ca.mobileconfig (iPhone, iPad). None of them is secret.
#
# expires, not add_header: an add_header here would drop the server's security headers in this location.
location /trust/ {
    alias    trust/;
    index    index.html;
    expires  -1;
    types {
        text/html                         html;
        text/css                          css;
        application/javascript            js;
        text/plain                        txt;
        application/x-x509-ca-cert        crt;
        application/x-apple-aspen-config  mobileconfig;
        application/octet-stream          bat;
    }
}
