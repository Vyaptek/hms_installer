# The names this box answers to, on HTTP and HTTPS alike (plan 24, L5): localhost, 127.0.0.1, any IPv4
# address (a box's DHCP address may change) and this computer's name, written by the installer. Add the
# hospital's own DNS names to server-names-extra.conf, which upgrades keep; the HTTPS certificate picks
# them up within the hour (lan-tls.ps1).
server_name  localhost 127.0.0.1 "~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$";
include      server-names.conf;
include      server-names-extra.conf;
