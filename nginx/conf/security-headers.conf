# Security headers for every response (backend plan 24, H4 and I2). Shared with the hosted web image in
# hms_webapp; keep the two copies the same.
#
# nginx drops server-level add_header lines in any location that has its own add_header, so a location
# that adds a header must include this file too.
#
# No HSTS: the box serves plain HTTP on the LAN until TLS is decided (plan 24, I2). A browser ignores
# HSTS over HTTP anyway.
#
# CSP, checked against hms_webapp on 2026-09-28:
# - style-src 'unsafe-inline': React style props, TipTap and docx-preview set inline styles.
# - blob: PDF previews and generated files open as blob URLs.
# - connect-src *.sentry.io: error reports (Sentry, US region, scrubbed; plan 24 D5). A box without
#   internet simply fails to send them. Firebase Analytics was removed (D4).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.sentry.io; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Sentry's browser profiling needs it.
add_header Document-Policy "js-profiling" always;
