name: Build HMS Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.2)"
        required: true
        default: "v1.0.0"
      backend_ref:
        description: "hospital_management_backend tag to build (a release tag, never a branch)"
        required: true
      frontend_ref:
        description: "hms_webapp tag to build (a release tag, never a branch)"
        required: true

# An installer is built from release tags of the backend and the frontend, never from whatever `main`
# is (backend plan 24, I1): the audited build must be the shipped build. A pushed installer tag vX.Y.Z
# builds backend and frontend tag vX.Y.Z, so tag all three repositories together.

# Bundled third-party binaries, pinned by version and SHA-256 so a rebuild of the same tag ships the
# same bytes. Refresh each quarter (Temurin: https://adoptium.net/temurin/releases/, LibreOffice:
# https://www.libreoffice.org/download/release-notes/, Garnet: https://github.com/microsoft/garnet/releases,
# .NET: https://dotnet.microsoft.com/download/dotnet/10.0).
env:
  # Temurin JRE, the backend's runtime on the box. Must match the backend's Gradle toolchain (25).
  JRE_VERSION: 25.0.4.1+1
  JRE_URL: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jre_x64_windows_hotspot_25.0.4.1_1.zip
  JRE_SHA256: 4c95451cea98556def2c54f7782933f52a26d4a36bd85e1d59f0364464828b07
  # LibreOffice, which turns reports into PDF. The archive URL outlives the release's place in
  # /stable/. LO_VERSION is what soffice.exe reports; hms.iss compares it with an installed copy.
  LO_VERSION: 26.2.6.3
  LO_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.6.3/win/x86_64/LibreOffice_26.2.6.3_Win_x86-64.msi
  LO_SHA256: f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660
  # Garnet, the box's cache server (sessions), in place of the archived Windows Redis port (backend
  # plan 24 §11, OP4). The zip's net10.0 build, which needs the .NET runtime below.
  GARNET_VERSION: 2.2.0
  GARNET_URL: https://github.com/microsoft/garnet/releases/download/v2.2.0/win-x64-based-readytorun.zip
  GARNET_SHA256: 8812ae916dd2386db6ebfaeeee3fb6508024f82ee4c66284532a1a5baa6afea2
  # .NET runtime (LTS). DOTNET_VERSION is the folder it installs under shared\Microsoft.NETCore.App;
  # hms.iss skips the install when that 10.0 patch or a later one is there.
  DOTNET_VERSION: 10.0.12
  DOTNET_URL: https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.12/dotnet-runtime-10.0.12-win-x64.exe
  DOTNET_SHA256: 02ea072c08f890f9dc0d3ac71b5fd4c2bfcdced4e1133e2d917ce5422b025585
  # age, which encrypts the box's backups to Vyaptek's key (backend plan 24 §11, OP11): age.exe and
  # age-keygen.exe from the Windows zip (https://github.com/FiloSottile/age/releases).
  AGE_VERSION: 1.3.2
  AGE_URL: https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip
  AGE_SHA256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ── Checkout all three repos ──────────────────────────────────────────

      - name: Checkout installer repo
        uses: actions/checkout@v6
        with:
          path: installer-repo

      - name: Resolve backend and frontend tags
        id: refs
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $be = "${{ inputs.backend_ref }}"
            $fe = "${{ inputs.frontend_ref }}"
          } else {
            $be = "${{ github.ref_name }}"
            $fe = "${{ github.ref_name }}"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "BACKEND=$be"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "FRONTEND=$fe"

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: Vyaptek/hospital_management_backend
          ref: refs/tags/${{ steps.refs.outputs.BACKEND }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: backend-src

      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          repository: Vyaptek/hms_webapp
          ref: refs/tags/${{ steps.refs.outputs.FRONTEND }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: frontend-src

      # Recorded in the release notes, so a box's installer can be traced to the exact audited commits.
      - name: Record the commits built
        id: shas
        run: |
          $be = git -C backend-src rev-parse HEAD
          $fe = git -C frontend-src rev-parse HEAD
          $in = git -C installer-repo rev-parse HEAD
          Add-Content -Path $env:GITHUB_OUTPUT -Value "BACKEND_SHA=$be"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "FRONTEND_SHA=$fe"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "INSTALLER_SHA=$in"

      - name: Resolve version
        id: ver
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}"
          }
          Write-Host "Version: $v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$v"
          # The release date, stamped into the jar and the installer (backend
          # optimization/26_PRODUCT_KEY_LICENSING.md §3.7): a perpetual license covers releases up to its
          # AMC end, and the installer asks before replacing anything. India's date, as the licenses use.
          $d = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "India Standard Time").ToString("yyyy-MM-dd")
          Write-Host "Release date: $d"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "RELEASE_DATE=$d"

      # ── Build frontend dist ───────────────────────────────────────────────

      # Same Node as hms_webapp's own CI. Node 20 reached end of life in April 2026.
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build frontend
        run: |
          # Dynamically locate the folder containing package.json
          $targetDir = (Get-ChildItem -Path "frontend-src" -Filter "package.json" -Recurse).DirectoryName
          Write-Host "Navigating to: $targetDir"
          Set-Location $targetDir
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api

      # ── Build backend JAR ─────────────────────────────────────────────────

      - name: Set up Java 25 (build only)
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build backend JAR
        working-directory: backend-src
        # Version and release date go into the jar's build-info, which the license check reads.
        run: ./gradlew bootJar --no-daemon "-PappVersion=$("${{ steps.ver.outputs.VERSION }}".TrimStart('v'))" "-PreleaseDate=${{ steps.ver.outputs.RELEASE_DATE }}"

      # ── Download large binaries from binaries-stable release ─────────────

      - name: Download bundled binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download binaries-stable --dir deps `
            --repo ${{ github.repository }} --pattern pg.exe

      - name: Download Java runtime, LibreOffice, Garnet and the .NET runtime
        run: |
          function Get-Pinned([string]$url, [string]$sha256, [string]$out) {
            Invoke-WebRequest $url -OutFile $out
            $hash = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($hash -ne $sha256) { throw "Checksum mismatch for $url`: got $hash" }
          }
          Get-Pinned $env:JRE_URL $env:JRE_SHA256 deps\jre.zip
          Get-Pinned $env:LO_URL $env:LO_SHA256 deps\libreoffice.msi
          Get-Pinned $env:GARNET_URL $env:GARNET_SHA256 deps\garnet.zip
          Get-Pinned $env:DOTNET_URL $env:DOTNET_SHA256 deps\dotnet-runtime.exe
          Get-Pinned $env:AGE_URL $env:AGE_SHA256 deps\age.zip
          Expand-Archive deps\jre.zip -DestinationPath deps\jre-unzipped
          Expand-Archive deps\garnet.zip -DestinationPath deps\garnet-unzipped
          Expand-Archive deps\age.zip -DestinationPath deps\age-unzipped

      # ── Assemble staging directory ────────────────────────────────────────

      - name: Assemble staging
        run: |
          $stage = "installer-repo"

          New-Item -ItemType Directory -Force $stage | Out-Null

          # Large binaries — now land next to hms.iss
          Copy-Item deps\pg.exe          $stage\
          Copy-Item deps\libreoffice.msi $stage\
          Copy-Item deps\dotnet-runtime.exe $stage\

          # age: the two programs the backups use, not its plugins.
          New-Item -ItemType Directory -Force "$stage\age" | Out-Null
          Copy-Item deps\age-unzipped\age\age.exe, deps\age-unzipped\age\age-keygen.exe "$stage\age\"

          # Garnet: the net10.0 server only. Not net8.0, not Service\ (Garnet's own Windows service host;
          # WinSW runs GarnetServer.exe instead), and not the sample garnet.conf: write-secrets.ps1 writes
          # each box's own.
          $garnet = "deps\garnet-unzipped\net10.0"
          if (-not (Test-Path "$garnet\GarnetServer.exe")) { throw "net10.0\GarnetServer.exe missing after unzip" }
          New-Item -ItemType Directory -Force "$stage\garnet\bin" | Out-Null
          Get-ChildItem $garnet -Exclude Service, garnet.conf | Copy-Item -Destination "$stage\garnet\bin" -Recurse

          # Java runtime: the zip holds one top-level folder (jdk-25.x+y-jre); hms.iss wants jre\bin\java.exe
          $jreRoot = Get-ChildItem deps\jre-unzipped -Directory | Select-Object -First 1
          Move-Item $jreRoot.FullName "$stage\jre"
          if (-not (Test-Path "$stage\jre\bin\java.exe")) { throw "jre\bin\java.exe missing after unzip" }

          # Backend JAR
          $jar = Get-ChildItem backend-src\build\libs\*.jar `
                   | Where-Object { $_.Name -notlike "*plain*" } `
                   | Select-Object -First 1
          New-Item -ItemType Directory -Force "$stage\backend" | Out-Null
          Copy-Item $jar.FullName "$stage\backend\hms.jar"

          # Frontend dist — use same discovery logic as the build step
          $frontendDir = (Get-ChildItem -Path "frontend-src" -Filter "package.json" `
                           -Recurse | Where-Object { $_.DirectoryName -notlike "*node_modules*" } `
                           | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force "$stage\frontend" | Out-Null
          Copy-Item "$frontendDir\dist\*" "$stage\frontend\" -Recurse

      # ── Software bill of materials (backend plan 24 §11, OP10) ────────────
      # CycloneDX 1.6, one file per part, attached to the release: the backend jar's (the Gradle plugin,
      # runtime classpath; Spring Boot also packs it into the jar), the frontend's npm packages without
      # dev dependencies, and the third-party programs bundled here, with each one's version and SHA-256.
      - name: Software bill of materials
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item backend-src\build\reports\cyclonedx\application.cdx.json output\sbom-backend.cdx.json

          $frontendDir = (Get-ChildItem -Path "frontend-src" -Filter "package.json" `
                           -Recurse | Where-Object { $_.DirectoryName -notlike "*node_modules*" } `
                           | Select-Object -First 1).DirectoryName
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --spec-version 1.6 `
            --package-lock-only --output-format JSON --output-file "$PWD\output\sbom-frontend.cdx.json" `
            "$frontendDir\package.json"
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-npm failed with exit code $LASTEXITCODE" }

          function Sha256([string]$path) { (Get-FileHash $path -Algorithm SHA256).Hash.ToLower() }
          function Component([string]$name, [string]$version, [string]$supplier, [string]$license, [string]$url, [string]$sha) {
            $c = [ordered]@{ type = 'application'; name = $name; version = $version; supplier = @{ name = $supplier } }
            if ($license) { $c.licenses = @(@{ license = @{ id = $license } }) }
            if ($url) { $c.externalReferences = @(@{ type = 'distribution'; url = $url }) }
            if ($sha) { $c.hashes = @(@{ alg = 'SHA-256'; content = $sha }) }
            return $c
          }
          $stage = "installer-repo"
          $nginxVersion = ((& "$stage\nginx\nginx.exe" -v 2>&1) -join ' ') -replace '.*nginx/', ''
          $components = @(
            (Component 'Eclipse Temurin JRE' $env:JRE_VERSION 'Eclipse Foundation' 'GPL-2.0-with-classpath-exception' $env:JRE_URL $env:JRE_SHA256),
            (Component 'LibreOffice' $env:LO_VERSION 'The Document Foundation' 'MPL-2.0' $env:LO_URL $env:LO_SHA256),
            (Component 'Microsoft Garnet' $env:GARNET_VERSION 'Microsoft' 'MIT' $env:GARNET_URL $env:GARNET_SHA256),
            (Component '.NET Runtime' $env:DOTNET_VERSION 'Microsoft' 'MIT' $env:DOTNET_URL $env:DOTNET_SHA256),
            (Component 'age' $env:AGE_VERSION 'Filippo Valsorda' 'BSD-3-Clause' $env:AGE_URL $env:AGE_SHA256),
            (Component 'PostgreSQL (EDB installer)' (Get-Item deps\pg.exe).VersionInfo.ProductVersion 'EnterpriseDB' 'PostgreSQL' '' (Sha256 deps\pg.exe)),
            (Component 'nginx' $nginxVersion 'F5' 'BSD-2-Clause' '' (Sha256 "$stage\nginx\nginx.exe")),
            (Component 'WinSW' (Get-Item "$stage\nginx-service.exe").VersionInfo.ProductVersion 'WinSW' 'MIT' '' (Sha256 "$stage\nginx-service.exe"))
          )
          $bom = [ordered]@{
            bomFormat = 'CycloneDX'; specVersion = '1.6'; version = 1
            serialNumber = 'urn:uuid:' + [guid]::NewGuid()
            metadata = [ordered]@{
              timestamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              component = [ordered]@{ type = 'application'; name = 'Vyaptek HMS installer'; version = "${{ steps.ver.outputs.VERSION }}".TrimStart('v') }
            }
            components = $components
          }
          $bom | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 output\sbom-bundled.cdx.json
          Get-ChildItem output\sbom-*.cdx.json | ForEach-Object { Write-Host "$($_.Name): $((Get-Content -Raw $_ | ConvertFrom-Json).components.Count) components" }

      # ── Compile installer ─────────────────────────────────────────────────

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: |
          # Dynamically locate the exact path to hms.iss
          $issFile = (Get-ChildItem -Path "installer-repo" -Filter "hms.iss" -Recurse).FullName
          Write-Host "Found Inno Setup script at: $issFile"

          # AppVersion without the tag's leading "v": it is what Windows shows under Apps.
          $appVersion = "${{ steps.ver.outputs.VERSION }}".TrimStart('v')

          # The bundled PostgreSQL release (major.minor): an upgrade brings an older 18.x on a box up to it.
          # The EDB installer's ProductVersion can be the bare major ("18"); FileVersion then carries the minor.
          $pgInfo = (Get-Item deps\pg.exe).VersionInfo
          $pgProduct = $pgInfo.ProductVersion
          if ($pgProduct -notmatch '^(18)\.(\d+)') { $pgProduct = $pgInfo.FileVersion }
          if ($pgProduct -notmatch '^(18)\.(\d+)') {
            throw "pg.exe is not PostgreSQL 18.x (ProductVersion '$($pgInfo.ProductVersion)', FileVersion '$($pgInfo.FileVersion)'): hms.iss and the service name assume 18"
          }
          $pgVersion = "$($Matches[1]).$($Matches[2])"
          Write-Host "Bundled PostgreSQL $pgVersion ($pgProduct)"

          # No release without Vyaptek's backup key: every box would fail every backup, and every upgrade.
          if (-not (Select-String -Path "$(Split-Path $issFile)\backup-master-key.txt" -Pattern '^age1[0-9a-z]+$' -Quiet)) {
            throw "backup-master-key.txt has no age1... key (backend scripts/new-backup-master-key.sh)"
          }

          # Run the compiler using the discovered path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="$appVersion" `
            /DLibreOfficeVersion="$env:LO_VERSION" `
            /DDotNetVersion="$env:DOTNET_VERSION" `
            /DPostgresVersion="$pgVersion" `
            /DAppReleaseDate="${{ steps.ver.outputs.RELEASE_DATE }}" `
            /O"output" `
            "$issFile"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Hash the installer
        id: hash
        run: |
          $h = (Get-FileHash output\HMSSetup.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "SHA256=$h"

      # ── Publish to GitHub Releases ────────────────────────────────────────

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.VERSION }}
          name: "Vyaptek HMS ${{ steps.ver.outputs.VERSION }}"
          body: |
            Built from:
            - hospital_management_backend `${{ steps.refs.outputs.BACKEND }}` (`${{ steps.shas.outputs.BACKEND_SHA }}`)
            - hms_webapp `${{ steps.refs.outputs.FRONTEND }}` (`${{ steps.shas.outputs.FRONTEND_SHA }}`)
            - hms_installer `${{ steps.shas.outputs.INSTALLER_SHA }}`
            - HMSSetup.exe SHA-256 `${{ steps.hash.outputs.SHA256 }}`
            - Bundled: Temurin JRE ${{ env.JRE_VERSION }}, LibreOffice ${{ env.LO_VERSION }}, Garnet ${{ env.GARNET_VERSION }}, .NET runtime ${{ env.DOTNET_VERSION }}, age ${{ env.AGE_VERSION }}, PostgreSQL 18 (binaries-stable)
            - Software bill of materials (CycloneDX 1.6): sbom-backend, sbom-frontend, sbom-bundled
          files: |
            output\HMSSetup.exe
            output\sbom-*.cdx.json
